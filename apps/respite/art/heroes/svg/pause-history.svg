ke-linejoin="round"/><rect x="586" y="348" width="420" height="260" rx="14" fill="#F7FBFC" stroke="#BDE1EC" stroke-width="2"/><rect x="586" y="348" width="420" height="10" rx="5" fill="#ffffff" opacity=".7"/></g><g><rect x="806" y="338" width="74" height="30" rx="9" fill="#8DB8CB"/><rect x="577" y="360" width="420" height="260" rx="14" fill="#EEF5F8" stroke="#BDE1EC" stroke-width="2"/><rect x="577" y="360" width="420" height="10" rx="5" fill="#ffffff" opacity=".7"/></g><g><rect x="864" y="350" width="74" height="30" rx="9" fill="#8DB8CB"/><rect x="568" y="372" width="420" height="260" rx="14" fill="#E4F0F5" stroke="#BDE1EC" stroke-width="2"/><rect x="568" y="372" width="420" height="10" rx="5" fill="#ffffff" opacity=".7"/></g><g><rect x="642" y="350" width="74" height="30" rx="9" fill="#3E9B4F"/><path d="M666 364 l9 8 l17 -15" fill="none" stroke="#F7FBFC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="559" y="372" width="420" height="260" rx="14" fill="#F7FBFC" stroke="#BDE1EC" stroke-width="2"/><rect x="559" y="372" width="420" height="10" rx="5" fill="#ffffff" opacity=".7"/></g><g><rect x="700" y="362" width="74" height="30" rx="9" fill="#8DB8CB"/><rect x="550" y="384" width="420" height="260" rx="14" fill="#EEF5F8" stroke="#BDE1EC" stroke-width="2"/><rect x="550" y="384" width="420" height="10" rx="5" fill="#ffffff" opacity=".7"/></g>
<!-- the lifted orange card -->
<g filter="url(#soft)" transform="translate(-150 -40) rotate(-11 770 275) scale(.86) translate(125 45)">
