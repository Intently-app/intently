<rect x="746" y="510" width="100" height="18" rx="4" fill="#DCEEF4"/>
<!-- sparks -->
<use href="#spark" transform="translate(1180 250) scale(1.1)" opacity=".9"/>
<use href="#spark" transform="translate(1120 190) scale(.8)" opacity=".85"/>
<use href="#spark" transform="translate(1230 330) scale(.6)" opacity=".8"/>
<use href="#spark" transform="translate(395 360) scale(.6)" opacity=".75"/>
<use href="#spark" transform="translate(1010 110) scale(.5)" opacity=".8"/>
