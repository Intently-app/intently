<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <clipPath id="L"><polygon points="0,0 1040,0 560,900 0,900"/></clipPath>
    <clipPath id="R"><polygon points="1040,0 1600,0 1600,900 560,900"/></clipPath>
    <linearGradient id="ls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24465A"/><stop offset="1" stop-color="#46606F"/></linearGradient>
    <linearGradient id="rs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BDE1EC"/><stop offset="1" stop-color="#EEF5F8"/></linearGradient>
    <radialGradient id="iron" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#7C93A1"/><stop offset=".5" stop-color="#46606F"/><stop offset="1" stop-color="#1A2E3A"/></radialGradient>
