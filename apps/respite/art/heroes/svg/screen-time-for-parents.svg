<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>

<linearGradient id="wall" x1="0" y1="0" x2="0" y2="720" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4D7D94"/><stop offset="0.5" stop-color="#9CC3D3"/><stop offset="1" stop-color="#C9E2EB"/></linearGradient>
<radialGradient id="glow" cx="800" cy="300" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FCEBC4" stop-opacity="0.75"/><stop offset="0.4" stop-color="#FCEBC4" stop-opacity="0.3"/><stop offset="1" stop-color="#FCEBC4" stop-opacity="0"/></radialGradient>
<linearGradient id="floor" x1="0" y1="720" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7FAABD"/><stop offset="1" stop-color="#5E8FA6"/></linearGradient>
