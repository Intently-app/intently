    <!-- small distant shelf with the phone, face down -->
    <rect x="1220" y="120" width="190" height="130" rx="6" fill="#0B1C27" opacity=".35" transform="translate(20 20)"/>
    <rect x="1220" y="236" width="190" height="16" fill="#3E2814"/>
    <rect x="1220" y="120" width="190" height="118" rx="4" fill="#8A6A44"/>
    <rect x="1220" y="120" width="190" height="8" fill="#A07D52"/>
    <rect x="1282" y="132" width="66" height="96" rx="12" fill="#0B1C27" opacity=".35" transform="translate(10 10)"/>
    <rect x="1282" y="132" width="66" height="96" rx="12" fill="#24465A"/>
    <rect x="1290" y="140" width="24" height="24" rx="6" fill="#2F6079"/>
    <circle cx="1298" cy="148" r="4" fill="#0B1C27"/><circle cx="1307" cy="157" r="4" fill="#0B1C27"/>
    <rect x="1340" y="146" width="4" height="70" rx="2" fill="#41788F"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)"/>
</svg>
