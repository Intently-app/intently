  <circle cx="0" cy="-92" r="46" fill="#7FA88E"/><circle cx="18" cy="-104" r="28" fill="#A8CDB8" opacity=".55"/>
</g>

<!-- figure walking -->
<g transform="translate(700 774)">
  <path d="M-30,0 L30,0 L-50,40 L-110,40Z" fill="#0B1C27" opacity=".2"/>
  <g fill="#24465A">
    <circle cx="4" cy="-196" r="19"/>
