</g><g transform="translate(560 660) scale(1)">
  <path d="M-6,0 L6,0 L-34,22 L-46,22Z" fill="#0B1C27" opacity=".2"/>
  <rect x="-5" y="-60" width="10" height="60" fill="#5C7A68"/>
  <circle cx="0" cy="-92" r="46" fill="#94BEA4"/><circle cx="18" cy="-104" r="28" fill="#A8CDB8" opacity=".55"/>
</g><g transform="translate(160 760) scale(1.5)">
