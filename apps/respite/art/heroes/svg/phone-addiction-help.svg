<!-- a fallen leaf being sniffed -->
<path d="M0,0 C8,-7 26,-7 34,0 C26,7 8,7 0,0Z" fill="#5C8A70" transform="translate(812 778) rotate(-12)"/>
<path d="M0,0 L30,0" stroke="#3E6E55" stroke-width="1.5" transform="translate(812 778) rotate(-12)"/>

<rect width="1600" height="900" filter="url(#grain)"/>
