<path d="M-10,630 V590 Q40,560 90,588 Q150,548 210,584 Q280,560 340,592 Q420,566 480,600 L480,630Z M900,630 V598 Q960,570 1020,596 Q1100,556 1170,590 Q1250,566 1320,594 Q1400,560 1470,588 Q1540,570 1610,590 V630Z" fill="#B9D9C3"/>
<rect x="0" y="630" width="1600" height="270" fill="url(#lawn)"/>
<!-- duck pond, glinting -->
<ellipse cx="300" cy="680" rx="230" ry="34" fill="#9CC3D3"/>
<ellipse cx="300" cy="676" rx="200" ry="24" fill="#BDE1EC"/>
<path d="M210,672 h60 M300,684 h80 M240,690 h30 M350,668 h40" stroke="#F7FBFC" stroke-width="4" stroke-linecap="round"/>
<path d="M410,670 q8,-14 18,-6 l8,-2 l-4,6 q6,8 -6,10 h-14Z" fill="#F7FBFC"/>
