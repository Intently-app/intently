<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Respite story: toast</title>
<!-- A Respite story screen for the 3D phone on Home (scripts/render-app-screens.mjs renders it).
     Letter tiles with the app name next to them become the real app icons when rendered. -->
<link rel="stylesheet" href="../ds/respite/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&amp;display=swap">
<style>
body{margin:0}
.scr{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;font-family:'Nunito Sans',system-ui,sans-serif;font-size:16.25px;line-height:1.3}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font-size:14px;font-weight:700}
.status span{display:flex;gap:5px;align-items:center}
h1,h2,p{margin:0}
.scr{height:auto;padding:12px 12px 16px;background:transparent}
.toast{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.97);box-shadow:0 10px 24px -10px rgba(19,34,45,.45);color:#13222d}
.toast .ic{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;font-weight:800}.toast b{display:block;font-family:Nunito,sans-serif;font-size:17px}
.toast small{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#b5651d}
:root[data-theme="mist-dark"] .toast{background:rgba(32,46,58,.97);color:#eef3f6}:root[data-theme="mist-dark"] .toast small{color:#f0b26a}
</style>
</head>
<body>
<x-dc>
<div class="scr"><div class="toast"><div aria-hidden="true" class="ic">R</div><span style="position:absolute;left:-999px">Respite</span><span><b>Walked away</b><small><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" /> </svg> 8 days · +10 acorns</small></span></div></div>
</x-dc>
</body>
</html>
