<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Respite story: Pixel home screen</title>
<!-- A Respite story screen for the 3D phone on Home (scripts/render-app-screens.mjs renders it).
     Letter tiles with the app name next to them become the real app icons when rendered. -->
<link rel="stylesheet" href="../ds/respite/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&amp;display=swap">
<style>
body{margin:0}
.scr{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;font-family:'Nunito Sans',system-ui,sans-serif;font-size:16.25px;line-height:1.3}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font-size:14px;font-weight:700}
.status span{display:flex;gap:5px;align-items:center}
h1,h2,p{margin:0}
.scr{display:flex;flex-direction:column;padding-bottom:22px;background:linear-gradient(170deg,#cfe2ec 0%,#e8f0f5 45%,#d5e3d9 100%);color:#13222d}
.glance{margin:44px 30px 0}.glance h1{font-family:Nunito,sans-serif;font-size:30px;font-weight:700;line-height:1.1}.glance p{display:flex;gap:6px;align-items:center;margin-top:6px;font-weight:700;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px;margin:auto 14px 0}
.app{display:grid;justify-items:center;gap:7px}.app span{font-size:12.5px;font-weight:600}
.ic{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#fff;font-weight:800;font-size:22px;box-shadow:0 3px 8px rgba(19,34,45,.18)}
.dock{display:flex;justify-content:space-around;margin:30px 18px 0}.dk{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.75);color:#2f6079}
.search{display:flex;align-items:center;gap:10px;margin:18px 18px 0;padding:14px 18px;border-radius:999px;background:rgba(255,255,255,.85);color:#5b6b76}.search i{flex:1}
:root[data-theme="mist-dark"] .scr{background:linear-gradient(170deg,#14283a 0%,#1b3242 50%,#1d2f2a 100%);color:#eef3f6}
:root[data-theme="mist-dark"] .dk,:root[data-theme="mist-dark"] .search{background:rgba(255,255,255,.12);color:#cfe0ea}
</style>
</head>
<body>
<x-dc>

3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384" /> </svg></span><span class="dk"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /> </svg></span><span class="dk"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" /> <circle cx="12" cy="13" r="3" /> </svg></span><span class="dk"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <rect width="18" height="18" x="3" y="3" rx="2" ry="2" /> <circle cx="9" cy="9" r="2" /> <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /> </svg></span></div><div class="search"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /> </svg><i></i><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoi </x-dc>
</body>
</html>
