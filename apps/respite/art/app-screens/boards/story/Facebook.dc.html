<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Respite story: a generic Facebook feed</title>
<!-- A Respite story screen for the 3D phone on Home (scripts/render-app-screens.mjs renders it).
     Letter tiles with the app name next to them become the real app icons when rendered. -->
<link rel="stylesheet" href="../ds/respite/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&amp;display=swap">
<style>
body{margin:0}
.scr{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;font-family:'Nunito Sans',system-ui,sans-serif;font-size:16.25px;line-height:1.3}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font-size:14px;font-weight:700}
.status span{display:flex;gap:5px;align-items:center}
h1,h2,p{margin:0}
.scr{background:#f0f2f5;color:#1c1e21}.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;background:#fff}
.bar .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#fff;font-weight:800}.dots{display:flex;gap:8px}.dots i{width:36px;height:36px;border-radius:50%;background:#e4e6eb}
.stories{display:flex;gap:8px;margin-top:8px;padding:12px 16px;background:#fff}.stories i{flex:1;height:150px;border-radius:12px;background:linear-gradient(160deg,#c9d6e3,#a7b8c9)}
.post{display:grid;gap:9px;margin-top:8px;padding:14px 16px;background:#fff}.ph{display:flex;gap:10px;align-items:center}.ph span{display:grid;flex:1;gap:6px}
.av{width:40px;height:40px;border-radius:50%;background:#cfd8e0}.ln{display:block;height:10px;border-radius:999px;background:#dde2e7}.photo{height:200px;border-radius:8px;background:linear-gradient(135deg,#d9c9b8,#b9c7d6 60%,#a9bfb1)}
.feed{filter:blur(.7px)}
:root[data-theme="mist-dark"] .scr{background:#18191a;color:#e4e6eb}:root[data-theme="mist-dark"] .bar,:root[data-theme="mist-dark"] .stories,:root[data-theme="mist-dark"] .post{background:#242526}
:root[data-theme="mist-dark"] .dots i,:root[data-theme="mist-dark"] .ln,:root[data-theme="mist-dark"] .av{background:#3a3b3c}
:root[data-theme="mist-dark"] .bar-wrap{background:#242526!important}
</style>
</head>
<body>
<x-dc>
<div class="scr"><div style="background:#fff" class="bar-wrap"><div class="status"><b>9:41</b><span><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M12 20h.01" /> <path d="M2 8.82a15 15 0 0 1 20 0" /> <path d="M5 12.859a10 10 0 0 1 14 0" /> <path d="M8.5 16.429a5 5 0 0 1 7 0" /> </svg><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M10 10v4" /> <path d="M14 10v4" /> <path d="M22 14v-4" /> <path d="M6 10v4" /> <rect x="2" y="6" width="16" height="12" rx="2" /> </svg></span></div></div><div class="bar"><div aria-hidden="true" class="ic">F</div><span style="position:absolute;left:-999px">Facebook</span><span class="dots"><i></i><i></i></span></div><div class="feed"><div class="stories"><i></i><i></i><i></i><i></i></div><div class="post"><div class="ph"><i class="av"></i><span><i class="ln" style="width:60%"></i><i class="ln" style="width:30%"></i></span></div><i class="ln" style="width:90%"></i><i class="ln" style="width:70%"></i><i class="photo"></i></div><div class="post"><div class="ph"><i class="av"></i><span><i class="ln" style="width:60%"></i><i class="ln" style="width:30%"></i></span></div><i class="ln" style="width:90%"></i><i class="ln" style="width:70%"></i><i class="photo"></i></div></div></div>
</x-dc>
</body>
</html>
