<link rel="stylesheet" href="../ds/respite/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&amp;display=swap">
<style>
body{margin:0}
.scr{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;font-family:'Nunito Sans',system-ui,sans-serif;font-size:16.25px;line-height:1.3}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;font-size:14px;font-weight:700}
.status span{display:flex;gap:5px;align-items:center}
h1,h2,p{margin:0}
.scr{background:#0b0b0d;color:#fff}.video{position:absolute;inset:0;background:radial-gradient(120% 70% at 30% 35%,#3c5a78 0%,#1d2a3a 45%,#0b0b0d 80%)}
.video:after{content:"";position:absolute;left:18%;top:26%;width:62%;height:34%;border-radius:40% 60% 50% 50%;background:linear-gradient(140deg,#e9b98f,#b97a5a);opacity:.55;filter:blur(18px)}
.top{position:relative;display:flex;justify-content:center;gap:22px;margin-top:16px;font-weight:700;opacity:.9}.top b{border-bottom:2px solid #fff;padding-bottom:4px}
.rail{position:absolute;right:12px;bottom:150px;display:grid;gap:20px;justify-items:center}.rl{display:grid;justify-items:center;gap:4px;font-size:12px}
.cap{position:absolute;left:16px;right:90px;bottom:110px;display:grid;gap:9px}.cap i{display:block;height:11px;border-radius:999px;background:rgba(255,255,255,.75)}
.nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:#000;display:flex;justify-content:space-around;align-items:center;opacity:.95}.nav i{width:26px;height:26px;border-radius:7px;background:#3a3a3d}
</style>
</head>
